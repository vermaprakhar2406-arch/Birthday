<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Day!</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Great+Vibes&family=Inter:wght@400;700&family=Lato:ital,wght@1,300&family=Poppins&display=swap" rel="stylesheet">
    
    <style>
        /* --- Global Styles --- */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712; /* Default dark background */
            color: white;
            overflow: hidden; /* Hide scrollbars */
            /* Disable pull-to-refresh and overscroll glow */
            overscroll-behavior: none;
        }
        
        .font-stylish {
            font-family: 'Great Vibes', cursive;
        }
        
        /* --- FONT FIX: Added 'Caveat' font class --- */
        .font-handwriting {
            font-family: 'Caveat', cursive;
        }
        
        /* Gradient for dark backgrounds */
        .text-gradient {
            background-image: linear-gradient(to right, #ec4899, #d8b4fe, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }
        
        /* --- EMOJI FIX: Added class to reset gradient on child elements --- */
        .text-reset {
            background-image: none;
            -webkit-background-clip: initial;
            -webkit-text-fill-color: initial;
            background-clip: initial;
            text-fill-color: initial;
        }
        
        .button-gradient {
            background-image: linear-gradient(to right, #ec4899, #d8b4fe, #a855f7);
        }

        /* Simple fade-in animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 1s ease-out forwards;
        }
        
        .fade-in-fast {
             animation: fadeIn 0.5s ease-out forwards;
        }

        /* --- NEW: Bunting Garland --- */
        .bunting-garland {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 10vh; /* Height of the garland area */
            max-height: 80px; /* Max height */
            z-index: 50; /* Above screen bg, below confetti pieces */
            pointer-events: none; /* Make it unclickable */
            overflow: hidden;
        }
        .bunting-svg {
            width: 100%;
            height: 100%;
        }
        .bunting-svg path {
            stroke: #d8b4fe;
            fill: none;
            stroke-linecap: round;
        }
        /* Flag colors */
        .bunting-svg .flag-pink {
            fill: #ec4899;
            stroke: none;
        }
        .bunting-svg .flag-purple-light {
            fill: #d8b4fe;
            stroke: none;
        }
        .bunting-svg .flag-purple-dark {
            fill: #a855f7;
            stroke: none;
        }

        /* Side strings */
        .side-string-left,
        .side-string-right {
            position: absolute;
            top: 0;
            width: 25%; /* Width of the string's area */
            height: 100%; /* Height of the string's area */
            max-width: 100px;
            max-height: 100px;
            filter: blur(0.5px);
        }
        .side-string-left path,
        .side-string-right path {
            fill: none;
            stroke: #ec4899;
            opacity: 0.7;
        }
        .side-string-left {
            left: 5%; /* Position from left */
        }
        .side-string-right {
            right: 5%; /* Position from right */
        }

        /* --- Screen Containers --- */
        .screen {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column; /* Allow text on top of elements */
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.5rem; /* default for left/right/bottom */
            /* UPDATED: Added more top padding to clear the bunting */
            padding-top: 7rem; /* 112px. Bunting is 80px max. Leaves 32px space. */
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 1.2s ease-out;
            opacity: 0;
            pointer-events: none;
            /* Ensure content is centered */
            box-sizing: border-box;
        }
        
        .screen.visible {
            opacity: 1;
            pointer-events: auto;
        }
        
        /* --- CAKE Screen CSS --- */
        
        #cake-screen {
            background-color: #030712; /* Dark background */
            font-family: 'Lato', sans-serif;
            cursor: pointer; /* Keeps click-to-blow-out functionality */
            position: relative; /* Needed for confetti */
            overflow: hidden; /* Keep poppers contained */
        }

        #cake-container {
            display: block;
            position: relative;
            margin: -6em auto 0 auto; /* Adjusted margin for screen */
            z-index: 10; /* Cake is above poppers */
        }

        .velas {
            background: #ffffff;
            border-radius: 10px;
            position: absolute;
            top: 228px; 
            left: 50%;
            transform: translateX(-50%); /* Centered horizontally */
            width: 5px;
            height: 35px;
            z-index: 10;
        }
        .velas:after, .velas:before {
            background: rgba(255, 255, 255, 0.4);
            content: "";
            position: absolute;
            width: 100%;
            height: 2.222222px; 
        }
        .velas:after {
            top: 25%;
            left: 0;
        }
        .velas:before {
            top: 45%;
            left: 0;
        }

        /* --- CSS for the flames (.fuego) --- */
        .fuego {
            display: block;
            position: absolute;
            background-color: #ffc0cb; /* Pinkish base */
            border-radius: 50%;
            box-shadow: 0 0 40px 10px rgba(248, 233, 236, 0.2), 0 0 0 0 rgba(255, 255, 255, 0.2), 0 -20px 20px -10px #ffc0cb, 0 -5px 10px 5px rgba(255, 170, 0, 0.4), 0 0px 10px 5px #ffa500;
            width: 8px;
            height: 15px;
            top: -12px;
            left: 50%;
            margin-left: -4px;
            animation: FuegoAnimation 1.5s ease-out infinite;
        }
        
        /* Hide flames when .out class is added */
        .velas.out .fuego {
            display: none;
            animation: none;
        }
        
        /* Flames animation */
        @keyframes FuegoAnimation {
            0%, 100% {
                transform: scaleY(1) scaleX(1);
                opacity: 1;
            }
            50% {
                transform: scaleY(1.2) scaleX(0.9);
                opacity: 0.8;
            }
        }
        
        /* --- Smoke Effect --- */
        .smoke {
            position: absolute;
            top: -12px; /* Same as flame */
            left: 50%;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            z-index: 11; /* Above wick */
            transform: translateX(-50%);
            opacity: 0; /* Hidden by default */
        }

        /* When candle is out, show and animate smoke */
        .velas.out .smoke {
            animation: smoke-animation 2.5s ease-out forwards;
        }

        /* Create multiple puffs */
        .velas.out .smoke::before,
        .velas.out .smoke::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: block;
            animation: smoke-animation 2.5s ease-out forwards;
        }

        .velas.out .smoke::before {
            animation-delay: 0.5s; /* Stagger the puffs */
        }

        .velas.out .smoke::after {
            animation-delay: 1s; /* Stagger the puffs */
        }

        /* Keyframes for the smoke */
        @keyframes smoke-animation {
            0% {
                transform: translate(-50%, 0) scale(0.5);
                opacity: 0;
            }
            20% {
                transform: translate(-50%, -10px) scale(1);
                opacity: 0.3;
            }
            100% {
                transform: translate(-40%, -60px) scale(2); /* Drift slightly */
                opacity: 0;
            }
        }


        /* --- Confetti simulation (FOR CAKE & WISH SCREEN) --- */
        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        
        .confetti {
            position: absolute;
            top: 0;
            left: 0;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            animation: confetti-fall 5s linear infinite;
            z-index: 100; /* Ensure confetti is on top */
        }


        /* --- [NEW] Balloon Page CSS (From User) --- */
        #balloon-screen {
            background: radial-gradient(circle at top, #1a001f, #000);
            font-family: 'Poppins', sans-serif;
            /* --- REVERT FIX: Removed justify-content: flex-start to re-center --- */
        }

        /* --- FONT FIX: DELETED the #balloon-title block --- */

        .balloon-container {
            display: flex;
            gap: 20px; /* --- LAYOUT FIX: Reduced gap --- */
            position: relative;
            flex-shrink: 0; /* Don't let container shrink */
        }

        .balloon-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .balloon {
            width: 60px; /* --- LAYOUT FIX: Reduced width --- */
            height: 80px; /* --- LAYOUT FIX: Reduced height --- */
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s ease;
            animation: float 3s ease-in-out infinite;
            box-shadow: 0 0 25px rgba(255,255,255,0.1);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .balloon:hover {
            transform: scale(1.05);
        }

        /* Glossy reflection */
        .balloon::before {
            content: "";
            position: absolute;
            top: 15px; /* --- LAYOUT FIX: Adjusted gloss --- */
            left: 18px; /* --- LAYOUT FIX: Adjusted gloss --- */
            width: 18px; /* --- LAYOUT FIX: Adjusted gloss --- */
            height: 25px; /* --- LAYOUT FIX: Adjusted gloss --- */
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            filter: blur(2px);
            transform: rotate(-20deg);
        }

        /* Diamond knot */
        .balloon::after {
            content: "";
            position: absolute;
            bottom: -8px; /* --- LAYOUT FIX: Adjusted knot --- */
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 10px; /* --- LAYOUT FIX: Adjusted knot --- */
            height: 10px; /* --- LAYOUT FIX: Adjusted knot --- */
            background: inherit;
        }

        /* String */
        .string {
            position: absolute;
            top: 110%;
            width: 2px;
            height: 80px;
            background: white;
            transition: visibility 0s 0.4s; /* Hide string after pop */
        }

        /* Pop animation */
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.8; filter: brightness(1.5); }
            100% { transform: scale(0); opacity: 0; }
        }

        .balloon.pop {
            animation: pop 0.4s ease forwards;
        }

        /* --- FONT STYLE FIX: REPLACED .text RULE --- */
        .text {
            position: absolute;
            top: 40%;
            font-size: 1.5rem; /* --- SIZE INCREASED --- */
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none; /* So it doesn't block clicks */
            font-family: 'Great Vibes', cursive; /* --- FONT STYLE ADDED --- */
        }

        /* --- NEW: Class for the standard gradient text --- */
        .text-standard-gradient {
            background-image: linear-gradient(to right, #ec4899, #d8b4fe, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        /* --- NEW: Class for the "love" text --- */
        .text-love-color {
            color: #ec4899; /* Bright pink from your gradient */
            text-shadow: 0 0 12px rgba(236, 72, 153, 0.7); /* Matching glow */
        }
        /* --- END FONT STYLE FIX --- */

        .text.show {
            opacity: 1;
        }

        /* Balloon colors */
        .red { background: radial-gradient(circle at 30% 30%, #ff7b7b, #ff4040); box-shadow: 0 0 30px rgba(255,64,64,0.4); }
        .orange { background: radial-gradient(circle at 30% 30%, #ffd86f, #ff9900); box-shadow: 0 0 30px rgba(255,153,0,0.4); }
        .green { background: radial-gradient(circle at 30% 30%, #7bffb0, #00c46b); box-shadow: 0 0 30px rgba(0,196,107,0.4); }
        .blue { background: radial-gradient(circle at 30% 30%, #9be0ff, #3498db); box-shadow: 0 0 30px rgba(52,152,219,0.4); }
        .purple { background: radial-gradient(circle at 30% 30%, #dba0ff, #9b59b6); box-shadow: 0 0 30px rgba(155,89,182,0.4); }

        /* Confetti for balloons */
        .balloon-confetti {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 14px;
            background: red;
            opacity: 0.9;
            border-radius: 2px;
            pointer-events: none;
            animation: balloon-fall 1s linear forwards;
            z-index: 200; /* High z-index */
        }

        @keyframes balloon-fall {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) rotate(720deg) scale(0.8); opacity: 0; }
        }

        /* --- NEW: Confetti for Cake Screen --- */
        .cake-burst-confetti {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 14px;
            background: red;
            opacity: 0.9;
            border-radius: 2px;
            pointer-events: none;
            animation: cake-burst-fall 1s linear forwards;
            z-index: 200; /* High z-index */
        }

        @keyframes cake-burst-fall {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) rotate(720deg) scale(0.8); opacity: 0; }
        }
        /* --- END NEW CAKE CONFETTI --- */


        /* [NEW] Styling for the Next button on this screen */
        #balloon-next-btn {
            opacity: 0;
            transform: scale(0.5); 
            pointer-events: none;
            transition: opacity 0.3s ease 0.1s, transform 0.3s ease 0.1s; 
            position: relative; 
            z-index: 20; 
            margin-top: 50px; /* Space it below the balloons */
        }
        #balloon-next-btn.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }


        /* --- NEW: Photo Stack Screen CSS --- */
        #photo-screen {
            background-color: #030712;
            justify-content: center; /* Center the stack */
            overflow: hidden; /* Prevent scrolling */
        }

        #photo-stack-container {
            position: relative;
            width: 90vw;
            height: 70vh;
            max-width: 400px;
            max-height: 600px;
            margin-top: -2rem; /* Pull up slightly */
            margin-bottom: 1rem;
            /* perspective: 1000px; */
        }

        .photo-card {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 1rem; /* Rounded corners */
            background-color: #333; /* Placeholder color */
            background-size: cover;
            background-position: center;
            
            /* Card-like border */
            border: 8px solid white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            
            /* Transition for moving back into deck */
            transition: transform 0.5s ease-out, opacity 0.5s ease-out;
            
            /* Make it swipeable */
            touch-action: none;
            cursor: grab;
            
            /* For text on card */
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);

            /* --- NEW: Transform origin for fanning --- */
            transform-origin: bottom center;
        }
        
        /* Class added by JS during swipe */
        .photo-card.swiping {
            transition: none; /* No transition while dragging */
            cursor: grabbing;
        }

        /* Button on photo screen */
        #photo-next-btn {
            opacity: 0;
            transform: scale(0.5);
            pointer-events: none;
            transition: opacity 0.3s ease 0.1s, transform 0.3s ease 0.1s; 
            margin-top: 1rem; /* Space below deck */
        }
        
        #photo-next-btn.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* --- Final Wish Screen CSS --- */
        #wish-screen {
            background: #030712; /* Back to dark theme */
        }
        
    </style>
</head>
<body>

    <div class="bunting-garland">
        <svg viewBox="0 0 100 20" preserveAspectRatio="none" class="bunting-svg">
            <path d="M -5 8 Q 12.5 20, 25 8 T 50 8 T 75 8 T 100 8 T 125 8" stroke-width="1" />
            
            <path d="M 5 8 L 12.5 16 L 20 8 Z" class="flag-pink" />
            <path d="M 30 8 L 37.5 16 L 45 8 Z" class="flag-purple-light" />
            <path d="M 55 8 L 62.5 16 L 70 8 Z" class="flag-purple-dark" />
            <path d="M 80 8 L 87.5 16 L 95 8 Z" class="flag-pink" />
        </svg>
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="side-string-left">
             <path d="M 0 0 C 10 30, 15 70, 20 100" stroke-width="2" />
        </svg>
         <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="side-string-right">
             <path d="M 100 0 C 90 30, 85 70, 80 100" stroke-width="2" />
        </svg>
    </div>

    <div class="relative">

        <div id="countdown-screen" class="screen visible">
            <div>
                <div id="countdown" class="text-9xl font-bold text-gradient mb-6">3</div>
                <p class="text-4xl font-stylish text-gradient fade-in">
                    Today is your special day
                </p>
            </div>
        </div>

        <div id="surprise-screen" class="screen">
            <div class="fade-in">
                <img src="https://placehold.co/400x300/ec4899/white?text=Your+GIF+Here" 
                     alt="Surprise Gif" 
                     class="rounded-lg shadow-xl mx-auto mb-8 w-full max-w-sm"
                     onerror="this.src='https://placehold.co/400x300/ec4899/white?text=Surprise!'">
                
                <p class="text-3xl font-stylish text-gradient mb-4">
                    A cutie pie was born today 22 years ago
                </p>
                
                <p class="text-2xl font-stylish text-gradient mb-10">
                    Yesss.... It's Youu.... My Cutiee... 
                    <span class="font-handwriting text-4xl text-pink-300 text-reset">Pari</span>
                    <span class="text-red-500 text-reset">❤️❤️</span>
                </p>

                <button id="start-surprise-btn" class="button-gradient text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition-all duration-300 hover:scale-110 hover:shadow-2xl focus:outline-none focus:ring-2 focus:ring-purple-400 focus:ring-opacity-75">
                    Start the surprise
                </button>
            </div>
        </div>

        <div id="cake-screen" class="screen">
            
            <div id="cake-confetti-container" class="absolute inset-0 z-0"></div>
            
            <p id="cake-text" class="text-4xl font-stylish text-gradient mb-8 fade-in relative z-10">
                Tap on the screen to Blow out the Candles
            </p>

            <div id="cake-container" class="relative z-10">
                <div class="velas">
                    <div class="fuego"></div>
                    <div class="smoke"></div>
                </div>
                
                <svg id="cake" version="1.1" x="0px" y="0px" width="200px" height="500px" viewBox="0 0 200 500" enable-background="new 0 0 200 500" xml:space="preserve">
                    <path fill="#FCA5A5" d="M100,420 C17.909,420,0,437.909,0,460 l0,30 c0,22.091,17.909,40,100,40 s100-17.909,100-40 l0-30 C200,437.909,182.091,420,100,420z"/>
                    <path fill="#FFF4F4" d="M100,360 C17.909,360,0,377.909,0,400 l0,10 c0,22.091,17.909,40,100,40 s100-17.909,100-40 l0-10 C200,377.909,182.091,360,100,360z"/>
                    <path fill="#FCA5A5" d="M100,300 C17.909,300,0,317.909,0,340 l0,30 c0,22.091,17.909,40,100,40 s100-17.909,100-40 l0-30 C200,317.909,182.091,300,100,300z"/>
                    <path fill="#FFF4F4" d="M100,250 C17.909,250,0,267.909,0,290 l0,20 c0,22.091,17.909,40,100,40 s100-17.909,100-40 l0-20 C200,267.909,182.091,250,100,250z"/>
                </svg>
            </div>
            
        </div>

        <div id="balloon-screen" class="screen">
            <h2 id="balloon-title" class="fade-in text-4xl font-stylish text-gradient mb-8">
                Pop all 5 balloons 🎈
            </h2>
            
            <div class="balloon-container">
              <div class="balloon-wrapper">
                <div class="balloon red" data-text="You"></div>
                <div class="string"></div>
                <div class="text text-standard-gradient"></div>
              </div>
              <div class="balloon-wrapper">
                <div class="balloon orange" data-text="are"></div>
                <div class="string"></div>
                <div class="text text-standard-gradient"></div>
              </div>
              <div class="balloon-wrapper">
                <div class="balloon green" data-text="my"></div>
                <div class="string"></div>
                <div class="text text-standard-gradient"></div>
              </div>
              <div class="balloon-wrapper">
                <div class="balloon blue" data-text="Cutiee"></div>
                <div class="string"></div>
                <div class="text text-love-color"></div>
              </div>
              <div class="balloon-wrapper">
                <div class="balloon purple" data-text="Piee"></div>
                <div class="string"></div>
                <div class="text text-love-color"></div>
              </div>
            </div>

            <button id="balloon-next-btn" class="button-gradient text-white font-bold py-3 px-8 rounded-full shadow-lg transform hover:scale-110 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:ring-opacity-75">
                Next
            </button>
        </div>

        <div id="photo-screen" class="screen">
            <h2 class="text-4xl font-stylish text-gradient fade-in mb-8">
                A few memories...
            </h2>
            
            <div id="photo-stack-container">
                </div>
            
            <button id="photo-next-btn" class="button-gradient text-white font-bold py-3 px-8 rounded-full shadow-lg transform hover:scale-110 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:ring-opacity-75">
                Continue
            </button>
        </div>

        <div id="wish-screen" class="screen">
            <div id="confetti-container" class="absolute inset-0 z-0"></div> 
            <div class="fade-in relative z-10">
                <h1 class="text-6xl font-stylish text-gradient mb-6">
                    Happy Birthday Pari!!
                </h1>
                <p class="text-2xl text-purple-200 mb-10">
                    Wishing you all the happiness in the world. ❤️❤️
                </p>
                <button id="restart-btn" class="border-2 border-purple-400 text-purple-300 font-bold py-3 px-8 rounded-full shadow-lg transform transition-all duration-300 hover:scale-110 hover:bg-purple-400 hover:text-white focus:outline-none">
                    Wanna see that again??
                </button>
            </div>
        </div>

    </div> 
    
    <audio id="bg-music" loop>
        <source src="How does Happy Birthday sound with marimba and bells_.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Get all elements
            const screens = {
                countdown: document.getElementById('countdown-screen'),
                surprise: document.getElementById('surprise-screen'),
                cake: document.getElementById('cake-screen'),
                balloon: document.getElementById('balloon-screen'),
                photo: document.getElementById('photo-screen'), // NEW screen
                wish: document.getElementById('wish-screen')
            };
            const countdownEl = document.getElementById('countdown');
            const startBtn = document.getElementById('start-surprise-btn');
            const cakeScreen = document.getElementById('cake-screen');
            const velas = document.querySelector('.velas');
            const cakeText = document.getElementById('cake-text');
            const restartBtn = document.getElementById('restart-btn');
            const bgMusic = document.getElementById('bg-music'); // --- MUSIC (Request 3) ---
            
            // Balloon elements
            const balloonNextBtn = document.getElementById('balloon-next-btn');
            // --- NEW: Get user's balloons ---
            const userBalloons = document.querySelectorAll('#balloon-screen .balloon');
            const userStrings = document.querySelectorAll('#balloon-screen .string');
            const userTexts = document.querySelectorAll('#balloon-screen .text');
            let poppedCount = 0;

            // NEW: Photo stack elements
            const photoStackContainer = document.getElementById('photo-stack-container');
            const photoNextBtn = document.getElementById('photo-next-btn');

            // Confetti elements
            const wishConfettiContainer = document.getElementById('confetti-container');
            const cakeConfettiContainer = document.getElementById('cake-confetti-container'); // RE-ADDED
            
            let currentScreen = 'countdown';
            let mainCountdownInterval;
            let cakeScreenConfettiInterval; // RE-ADDED
            let wishScreenConfettiInterval;

            const confettiColors = [ // For shower confetti
                '#FF6F61', '#6B5B95', '#88B04B', '#F7CAC9', '#92A8CD', 
                '#FFD700', '#40E0D0', '#FF7F50', '#DA70D6', '#BA55D3',
                '#3CB371', '#ADD8E6', '#F08080', '#20B0AA' 
            ];

            // NEW: Photo stack placeholders. 
            // --- BUG FIX: Added https:// to URLs ---
            const photoUrls = [
                "https://placehold.co/400x600/ec4899/white?text=Photo+1",
                "https://placehold.co/400x600/d8b4fe/white?text=Photo+2",
                "https://placehold.co/400x600/a855f7/white?text=Photo+3",
                "https://placehold.co/400x600/f472b6/white?text=Photo+4",
                "https://placehold.co/400x600/c084fc/white?text=Photo+5",
                "https://placehold.co/400x600/9333ea/white?text=Photo+6"
            ];
            let photoSwipeCount = 0;
            const totalPhotos = photoUrls.length;


            // Function to switch screens
            function showScreen(screenName) {
                if (!screens[screenName]) {
                    console.error('Invalid screen name:', screenName);
                    return;
                }

                for (const key in screens) {
                    if (screens[key]) { 
                        screens[key].classList.remove('visible');
                    }
                }
                screens[screenName].classList.add('visible');
                currentScreen = screenName;
                
                // --- NEW: Stop all confetti showers by default ---
                stopConfetti(wishConfettiContainer);
                stopConfetti(cakeConfettiContainer);
                
                // Manage confetti and buttons based on screen
                if (screenName === 'wish') {
                    startConfetti(wishConfettiContainer); // Start final shower
                } else if (screenName === 'cake') {
                    // Confetti starts on click, not on screen load
                } else if (screenName === 'photo') { // NEW
                    setTimeout(createPhotoStack, 10); // Create photo stack
                }

                if (balloonNextBtn) balloonNextBtn.classList.remove('visible');
                if (photoNextBtn) photoNextBtn.classList.remove('visible'); // Hide photo next btn
            }
            
            function startCountdown() {
                if (mainCountdownInterval) {
                    clearInterval(mainCountdownInterval);
                }
                
                if (!countdownEl) {
                    console.error('Countdown element not found!');
                    return;
                }

                let count = 3;
                countdownEl.textContent = count;
                
                mainCountdownInterval = setInterval(() => {
                    count--;
                    
                    if (count > 0) {
                        countdownEl.textContent = count;
                    } else { 
                        clearInterval(mainCountdownInterval);
                        mainCountdownInterval = null;
                        showScreen('surprise');
                    }
                }, 1000);
            }

            // 1. Countdown Logic
            startCountdown();

            // 2. Surprise Screen Logic
            if (startBtn) {
                startBtn.addEventListener('click', () => {
                    
                    // --- MUSIC START (Request 3) ---
                    if (bgMusic) {
                        // Play music on the first user click
                        bgMusic.play().catch(e => console.error("Audio play failed:", e));
                    }
                    // --- END MUSIC START ---

                    showScreen('cake');
                });
            }

            // 3. Cake Screen Logic
            if (cakeScreen) {
                cakeScreen.addEventListener('click', () => {
                    if (!velas || velas.classList.contains('out')) return;

                    velas.classList.add('out');
                    
                    if (cakeText) {
                        // --- EMOJI FIX: Use innerHTML to add reset class ---
                        cakeText.innerHTML = 'Happy Birthday Cutie <span class="text-reset">🥰</span>';
                        cakeText.classList.remove('fade-in'); 
                        void cakeText.offsetWidth; // Force reflow
                        cakeText.classList.add('fade-in-fast');
                    }
                    
                    // --- TRIGGER ALL CELEBRATIONS ---
                    
                    // --- NEW: Start the continuous shower ---
                    startConfetti(cakeConfettiContainer);

                    // --- NEW: Trigger double burst confetti ---
                    setTimeout(() => {
                        createCakeBurstConfetti(150); // First burst
                        setTimeout(() => createCakeBurstConfetti(150), 400); // Second burst
                    }, 300); // Small delay
                    
                    // --- END CELEBRATIONS ---


                    setTimeout(() => {
                        stopConfetti(cakeConfettiContainer); // Stop shower before changing screen
                        showScreen('balloon');
                    }, 5000); 
                });
            }
            
            
            // --- 4. Balloon Screen Logic (from User) ---
            
            userBalloons.forEach(balloon => {
                balloon.addEventListener('click', () => {
                  if (!balloon.classList.contains('pop')) {
                    const wrapper = balloon.parentElement;
                    const string = wrapper.querySelector('.string');
                    const textDiv = wrapper.querySelector('.text');
                    
                    textDiv.textContent = balloon.dataset.text;
                    textDiv.classList.add('show');
                    balloon.classList.add('pop');
                    string.style.visibility = 'hidden'; // Hide string

                    // Confetti burst (each balloon)
                    createBalloonConfetti(60);

                    poppedCount++;
                    if (poppedCount === userBalloons.length) {
                      // Big double confetti explosion at the end
                      setTimeout(() => {
                        createBalloonConfetti(150);
                        setTimeout(() => createBalloonConfetti(150), 400);
                        
                        // --- MY INTEGRATION: SHOW NEXT BUTTON ---
                        if (balloonNextBtn) {
                            balloonNextBtn.classList.add('visible');
                        }
                        // --- END INTEGRATION ---

                      }, 300);
                    }
                  }
                });
            });

            // Helper function for user's balloon confetti
            function createBalloonConfetti(amount) {
                for (let i = 0; i < amount; i++) {
                  const confetti = document.createElement('div');
                  confetti.classList.add('balloon-confetti'); // Renamed class
                  confetti.style.background = randomBalloonColor();
                  confetti.style.setProperty('--x', `${(Math.random() - 0.5) * 600}px`);
                  confetti.style.setProperty('--y', `${(Math.random() - 0.5) * 600}px`);
                  
                  // Append to the balloon screen, not body
                  screens.balloon.appendChild(confetti); 
                  
                  setTimeout(() => confetti.remove(), 1000);
                }
            }
            
            // --- NEW: Helper function for cake burst confetti ---
            function createCakeBurstConfetti(amount) {
                for (let i = 0; i < amount; i++) {
                  const confetti = document.createElement('div');
                  confetti.classList.add('cake-burst-confetti'); // NEW class
                  confetti.style.background = randomBalloonColor(); // Reuse color func
                  confetti.style.setProperty('--x', `${(Math.random() - 0.5) * 600}px`);
                  confetti.style.setProperty('--y', `${(Math.random() - 0.5) * 600}px`);
                  
                  // Append to the CAKE screen
                  screens.cake.appendChild(confetti); 
                  
                  setTimeout(() => confetti.remove(), 1000); // Self-removing
                }
            }
            // --- END NEW FUNCTION ---

            // Helper function for user's confetti color
            function randomBalloonColor() {
                const colors = ['#ff4d4d', '#ffcc00', '#00ffcc', '#66b3ff', '#ff99ff', '#ffffff'];
                return colors[Math.floor(Math.random() * colors.length)];
            }
            
            // My button listener
            if (balloonNextBtn) {
                balloonNextBtn.addEventListener('click', () => {
                    showScreen('photo');
                });
            }


            /**
             * --------------------------------------
             * 5. NEW: PHOTO STACK LOGIC (FANNING)
             * --------------------------------------
             */
            
            let swipeActiveCard = null;
            let swipeStartX = 0;
            let swipeCurrentX = 0;
            let swipeIsSwiping = false;

            function createPhotoStack() {
                if (!photoStackContainer) return;
                
                photoStackContainer.innerHTML = ''; // Clear old cards
                photoSwipeCount = 0;
                if(photoNextBtn) photoNextBtn.classList.remove('visible');

                // Create cards in order
                photoUrls.forEach((url, index) => {
                    const card = document.createElement('div');
                    card.className = 'photo-card';
                    card.style.backgroundImage = `url(${url})`;
                    
                    // --- NEW: Set initial state as "unseen" and fanned right ---
                    card.dataset.seenDirection = 'right'; // All start fanned right
                    
                    photoStackContainer.appendChild(card);
                });
                
                // Run update to set initial positions
                updateCardPositions();
                
                // Add swipe listeners to the new top card
                attachSwipeListeners();
            }

            // --- BUG FIX: REMOVED STRAY DEBUG TEXT ---

            function attachSwipeListeners() {
                // The top card is always the last one in the DOM
                swipeActiveCard = photoStackContainer.querySelector('.photo-card:last-of-type'); 
                if (!swipeActiveCard) return;
                
                // Attach to new top card
                swipeActiveCard.addEventListener('pointerdown', onSwipeStart, { once: true });
            }
            
            // --- Listeners on document, added ONCE. ---
            document.addEventListener('pointermove', onSwipeMove);
            document.addEventListener('pointerup', onSwipeEnd);
            document.addEventListener('pointercancel', onSwipeEnd);

            function onSwipeStart(e) {
                if (swipeIsSwiping) return; // Prevent multi-touch bugs

                // The top card is the last child
                const topCard = photoStackContainer.querySelector('.photo-card:last-of-type');
                if (e.target !== topCard && !topCard.contains(e.target)) return;
                
                swipeIsSwiping = true;
                swipeActiveCard = topCard; // Ensure we have the right card
                swipeActiveCard.classList.add('swiping');
                swipeStartX = e.clientX;
                
                // Capture pointer events
                try {
                    swipeActiveCard.setPointerCapture(e.pointerId); 
                } catch (err) { /* ignore */ }
            }

            function onSwipeMove(e) {
                if (!swipeIsSwiping || !swipeActiveCard) return;
                swipeCurrentX = e.clientX;
                const deltaX = swipeCurrentX - swipeStartX;
                const rotation = deltaX / 20; // Rotate based on distance
                
                // The top card's base state is always scale(1) translate(0,0)
                const baseTransform = 'translate(0px, 0px) scale(1) rotate(0deg)';
                
                // Apply drag transform
                swipeActiveCard.style.transform = `${baseTransform} translateX(${deltaX}px) rotate(${rotation}deg)`;
            }

            function onSwipeEnd(e) {
                if (!swipeIsSwiping || !swipeActiveCard) return;
                swipeIsSwiping = false;
                swipeActiveCard.classList.remove('swiping');
                
                try {
                    swipeActiveCard.releasePointerCapture(e.pointerId);
                } catch (err) { /* ignore */ }

                const deltaX = swipeCurrentX - swipeStartX;
                const swipeThreshold = 80; // Min distance to swipe
                const direction = deltaX > 0 ? 1 : -1;

                if (Math.abs(deltaX) > swipeThreshold) {
                    // Successful swipe
                    swipeActiveCard.style.transform = `translateX(${direction * 500}px) rotate(${direction * 30}deg) scale(0.8)`;
                    swipeActiveCard.style.opacity = "0";
                    
                    // Move card to back after animation, passing direction
                    setTimeout(() => {
                        reDeckCard(swipeActiveCard, direction);
                    }, 500); // 500ms transition
                } else {
                    // Failed swipe, snap back to top position
                    swipeActiveCard.style.transform = 'translate(0px, 0px) scale(1) rotate(0deg)';
                    // Re-attach listener since the swipe failed
                    swipeActiveCard.addEventListener('pointerdown', onSwipeStart, { once: true });
                }

                // Reset for next swipe
                swipeStartX = 0;
                swipeCurrentX = 0;
            }

            function reDeckCard(card, direction) {
                // --- NEW: Set seen direction based on swipe ---
                card.dataset.seenDirection = (direction > 0 ? 'right' : 'left');
                
                // Move card to the *front* of the DOM (bottom of deck)
                photoStackContainer.prepend(card);
                
                // Reset its style to be at the bottom
                card.style.opacity = "1";
                
                // Redo all card positions
                updateCardPositions();
                
                // Attach listeners to the new top card
                attachSwipeListeners();
                
                // Check if all photos have been seen
                photoSwipeCount++;
                if (photoSwipeCount >= totalPhotos) {
                    setTimeout(() => {
                        if(photoNextBtn) photoNextBtn.classList.add('visible');
                    }, 500);
                }
            }
            
            function updateCardPositions() {
                const cards = photoStackContainer.querySelectorAll('.photo-card');
                const numCards = cards.length;
                let seenLeftCount = 0;
                let seenRightCount = 0;
                
                // Re-apply styles to all cards
                cards.forEach((card, index) => {
                    const isTopCard = (index === numCards - 1);
                    
                    if (isTopCard) {
                        // This is the active, swipable card
                        card.style.transform = 'translate(0px, 0px) scale(1) rotate(0deg)';
                        card.style.zIndex = 100;
                    } else {
                        // --- NEW: This is a "seen" card at the bottom ---
                        const scale = 0.9;
                        const translateY = 10;
                        let rotate, translateX;
                        
                        if (card.dataset.seenDirection === 'left') {
                            // Fan to the left
                            rotate = -5 - (seenLeftCount * 2); // Stacking rotation
                            translateX = -20 - (seenLeftCount * 5); // Stacking offset
                            card.style.zIndex = seenLeftCount;
                            seenLeftCount++;
                        } else {
                            // Fan to the right (default)
                            rotate = 5 + (seenRightCount * 2);
                            translateX = 20 + (seenRightCount * 5);
                            card.style.zIndex = seenRightCount;
                            seenRightCount++;
                        }
                        
                        card.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale}) rotate(${rotate}deg)`;
                    }
                });
            }

            // Photo next button goes to final wish screen
            if (photoNextBtn) {
                photoNextBtn.addEventListener('click', () => {
                    showScreen('wish');
                });
            }


            /**
             * --------------------------------------
             * 6. FINAL WISH SCREEN & RESTART LOGIC
             * --------------------------------------
             */
            
            if (restartBtn) {
                restartBtn.addEventListener('click', () => {
                    // --- RESTART LOGIC (Request 2) ---

                    // 1. Reset the cake screen
                    if (velas) velas.classList.remove('out');
                    if (cakeText) cakeText.innerHTML = 'Tap on the screen to Blow out the Candles'; // Resets to plain text
                    
                    // 2. Reset balloon screen
                    poppedCount = 0;
                    userBalloons.forEach(balloon => {
                        balloon.classList.remove('pop');
                        const wrapper = balloon.parentElement;
                        wrapper.querySelector('.string').style.visibility = 'visible';
                        wrapper.querySelector('.text').classList.remove('show');
                    });
                    
                    // 3. Reset photo screen
                    photoSwipeCount = 0;
                    
                    // 4. Go back to the CAKE screen
                    showScreen('cake');
                    
                    // 5. DO NOT restart countdown
                });
            }
            

            /**
             * --------------------------------------
             * 7. CONFETTI HELPER FUNCTIONS (FOR WISH & CAKE)
             * --------------------------------------
             */
            
            function createConfetti(container) {
                if (!container) return;
                
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                
                const animDuration = Math.random() * 2 + 3; // 3 to 5 seconds
                confetti.style.animationDuration = animDuration + 's';

                container.appendChild(confetti);

                setTimeout(() => {
                    if (confetti) confetti.remove();
                }, animDuration * 1000);
            }

            // --- UPDATED: This function now has an immediate burst ---
            function startConfetti(container) {
                if (!container) return;
                
                stopConfetti(container); 
                
                // --- NEW: IMMEDIATE BURST ---
                // Fire a bigger burst immediately
                for(let i = 0; i < 15; i++) { 
                    createConfetti(container);
                }
                // --- END NEW ---
                
                const intervalId = setInterval(() => {
                    // Regular, smaller bursts
                    // --- BUG FIX: This was 'i = s', now fixed
                    for(let i = 0; i < 5; i++) {
                        createConfetti(container);
                    }
                }, 400); 
                
                // --- UPDATED to handle both containers ---
                if (container.id === 'confetti-container') {
                    wishScreenConfettiInterval = intervalId;
                } else if (container.id === 'cake-confetti-container') {
                    cakeScreenConfettiInterval = intervalId;
                }
            }

            function stopConfetti(container) {
                if (!container) return; // Add null check

                let intervalId = null;
                
                // --- UPDATED to handle both containers ---
                if (container.id === 'confetti-container') {
                    intervalId = wishScreenConfettiInterval;
                    wishScreenConfettiInterval = null;
                } else if (container.id === 'cake-confetti-container') {
                    intervalId = cakeScreenConfettiInterval;
                    cakeScreenConfettiInterval = null;
                }

                if (intervalId) {
                    clearInterval(intervalId);
                }
                
                container.innerHTML = ''; 
            }

        }); // End of DOMContentLoaded
    </script>
</body>
</html>
